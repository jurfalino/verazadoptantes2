name: Playwright E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [master, staging, e2e_tests]
  pull_request:
    branches: [master, staging]

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: test failures are visible but don't gate merges
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create local D1 database
        run: |
          npx wrangler d1 execute DB --local --command="SELECT 1"
          for f in drizzle/*.sql; do
            echo "Applying migration: $f"
            npx wrangler d1 execute DB --local --file="$f" || echo "⚠️ Migration $f had errors (likely pre-existing tables), continuing..."
          done

      - name: Seed test data (Wrangler D1)
        run: npx wrangler d1 execute DB --local --file="tests/seed.sql"

      - name: Seed country data (resilient)
        run: |
          npx wrangler d1 execute DB --local --command="UPDATE adopters SET country = 'AR' WHERE id LIKE 'test-adopter-%'" || echo "⚠️ country column not found, skipping"

      - name: Seed local.db fallback (used by next dev)
        run: |
          sudo apt-get install -y sqlite3
          for f in drizzle/*.sql; do
            echo "Applying migration to local.db: $f"
            sqlite3 local.db < "$f" || echo "⚠️ Migration $f had errors, continuing..."
          done
          sqlite3 local.db < tests/seed.sql
          sqlite3 local.db "UPDATE adopters SET country = 'AR' WHERE id LIKE 'test-adopter-%'" || echo "⚠️ country column not found in local.db, skipping"


      - name: Run Playwright tests
        run: npx playwright test --project=unauthed --project=setup --project=authed
        env:
          CI: true
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: http://localhost:3000

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
