# Playwright E2E tests require a local Cloudflare D1 database with seeded data.
# These tests cannot run in GitHub Actions — they are meant for local development only.
# Run locally with: npx playwright test
#
# To re-enable in CI, you would need to:
#   1. Add wrangler D1 setup steps
#   2. Seed the local D1 database
#   3. Run `npm run dev` with Cloudflare bindings
#
# For now, CI only runs: type-check, lint, and build (see ci.yml)

name: Playwright Tests (Local Only)
on:
  workflow_dispatch: # Manual trigger only
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
