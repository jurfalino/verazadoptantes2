name: Notification health

# A thing that does not happen produces no error, only silence. Owner
# notifications and access requests were broken in production from May to
# 2026-09-19 and nobody noticed for four months, because nothing anywhere said
# so. 2.56.70 added log lines, but a log line needs a human to go and look —
# which is precisely what failed. This asks the database once a day and fails
# loudly, so the answer arrives instead of waiting to be fetched.

on:
  schedule:
    - cron: '0 14 * * *' # 11:00 America/Argentina/Buenos_Aires
  workflow_dispatch:
    inputs:
      days:
        description: 'Window in days'
        required: false
        default: '7'

concurrency:
  group: notification-health
  cancel-in-progress: false

jobs:
  check:
    name: Did notifications reach their owners?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check production
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/check-notification-health.mjs --days "${{ github.event.inputs.days || '7' }}" 2>&1 | tee health.txt
          exit "${PIPESTATUS[0]}"

      # One open issue, not one per day: a daily pile of identical issues is
      # noise, and noise is how the last four months happened.
      - name: Open an issue if it is broken
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create notification-health --color B60205 \
            --description "Production notifications are not reaching record owners" 2>/dev/null || true
          existing=$(gh issue list --label notification-health --state open --json number --jq '.[0].number' || true)
          body=$'Notifications are not reaching record owners in production.\n\n```\n'"$(cat health.txt 2>/dev/null || echo 'no output captured')"$'\n```\n\nRun: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Notifications are not reaching owners in production" \
              --label notification-health --body "$body"
          fi
