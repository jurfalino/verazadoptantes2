name: Followup Cron Worker

on:
  push:
    branches: [master, staging]
    paths:
      - 'workers/followup-cron/**'
      - 'src/domain/followups.ts'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: 🔔 Deploy Followup Cron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IS_PROD: ${{ github.ref == 'refs/heads/master' || inputs.target == 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      # Root install: wrangler lives in the root devDependencies and the Worker
      # bundles src/domain/followups.ts from the main app by relative path.
      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks the app pipeline runs before ITS
      # deploy. Without these this job went checkout → npm ci → wrangler deploy,
      # so any commit touching src/domain/followups.ts shipped a new cron
      # straight to production — bound to the prod D1 and firing daily — with
      # no type check and no tests, while the app it shares that file with
      # could not deploy without build, lint, migrations and e2e all passing.
      #
      # tsconfig.json includes **/*.ts with only node_modules, scraper and
      # contract-app excluded, so this type-checks the Worker itself, not just
      # the app. followups.ts is pure domain logic and is covered by
      # src/domain/followups.test.ts.
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            npx wrangler deploy --config workers/followup-cron/wrangler.toml
          else
            npx wrangler deploy --config workers/followup-cron/wrangler.toml --env staging
          fi
