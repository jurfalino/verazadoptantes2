name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Skip actual Cloudflare binding checks during CI build
          SKIP_ENV_VALIDATION: 'true'

  # This job runs after build-and-lint passes
  # It's a "gate" that must pass before merging to main
  ready-to-merge:
    name: ✅ Ready to Merge
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    steps:
      - run: echo "All checks passed!"
