name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

# Serialise per branch, at the WORKFLOW level.
#
# The deploy jobs used to carry `concurrency: deploy-staging|deploy-production`
# with `cancel-in-progress: true`. Every run contains BOTH deploy jobs — one
# disabled by an `if`, but still a member of its group — so a newer run entering
# `deploy-staging` cancelled an in-flight sibling run on the OTHER branch, and
# cancelled it wholesale rather than just its deploy. On 2026-09-03 a push to
# staging killed the production run for PR #76 at its E2E step, so
# `Deploy to Production` was skipped and prod silently stayed on the previous
# version after a green merge. Nothing failed; the deploy simply never ran.
#
# Keying the group to the ref confines superseding to the same branch.
# `cancel-in-progress` is deliberately FALSE on master: a newer staging push
# should replace an older one, but a production deploy already under way should
# finish rather than be interrupted part-way through `wrangler pages deploy`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Blocks a package.json version that moves BACKWARDS relative to its own
  # history. package.json is the only reliable deploy identity here, and on
  # 2026-09-06 two parallel sessions produced 2.56.0 followed by 2.55.19.
  # Its own job (not a build-and-lint step) so the failure names the problem
  # instead of hiding inside a build log — and it needs git history, which the
  # default fetch-depth: 1 checkout does not provide.
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Check version does not regress
        run: node scripts/check-version-bump.mjs

  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every other job descends from this one, so gating it here stops a
    # regressed version reaching migrations or a deploy — and fails in ~30s
    # rather than after a full build.
    needs: [version-guard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # vitest 4 needs rolldown's linux native binary. It IS in package-lock,
      # but `npm ci` skips it: `.npmrc` sets legacy-peer-deps=true, which hits
      # npm's optional-dependency bug ("Cannot find module
      # '@rolldown/binding-linux-x64-gnu'", 2.56.20 → pulled in 2.56.21). Unpack
      # exactly the version rolldown asks for, without `npm install`, which would
      # re-resolve the whole tree. Restored 2.56.67 (audit 2026-09-19, P1-2):
      # the domain tests for deploy recovery never gated a deploy before this.
      - name: Install rolldown native binding (npm optional-deps bug)
        run: |
          V=$(node -p "require('./node_modules/rolldown/package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu']")
          if [ -d node_modules/@rolldown/binding-linux-x64-gnu ]; then echo "binding already installed ($V)"; exit 0; fi
          npm pack "@rolldown/binding-linux-x64-gnu@$V" --silent
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf rolldown-binding-linux-x64-gnu-$V.tgz -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          rm -f rolldown-binding-linux-x64-gnu-$V.tgz
          node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('rolldown binding', process.argv[1], 'OK')" "$V"

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Skip actual Cloudflare binding checks during CI build
          SKIP_ENV_VALIDATION: 'true'

  # This job runs after build-and-lint passes
  # It's a "gate" that must pass before merging to main
  ready-to-merge:
    name: ✅ Ready to Merge
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    steps:
      - run: echo "All checks passed!"

  # Apply D1 migrations on production deploy
  migrate-production:
    name: 🗃️ Apply D1 Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-and-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to production
        run: npx wrangler d1 migrations apply pet-adoption-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Idempotent data backfill — parses legacy `contact_info` blobs into
      # structured `contact_entries` for pre-v2.14.x rows so the PII popover
      # has a chip to anchor to. Re-runs are no-ops once a row is migrated
      # (the script's WHERE clause skips rows that already have entries).
      - name: Backfill contact_entries (idempotent)
        run: npx tsx scripts/backfill-contact-entries.ts --target=production --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Apply D1 migrations on staging deploy
  migrate-staging:
    name: 🗃️ Apply Staging Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: [build-and-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to staging
        run: npx wrangler d1 migrations apply pet-adoption-db-staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Idempotent data backfill — same as production (see migrate-production).
      # Running on staging too keeps the two environments in lockstep.
      - name: Backfill contact_entries (idempotent)
        run: npx tsx scripts/backfill-contact-entries.ts --target=staging --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Advisory: flags ON in production but not in tests/seed.sql mean the e2e
      # suite never runs the code users run (how v2.56.62 shipped). Read-only
      # query of production app_config; never fails the run. Audit PR-4.
      - name: Feature-flag parity (seed vs production)
        continue-on-error: true
        run: node scripts/check-flag-parity.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploy to Staging (Direct Upload)
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    # The suite runs 10-15 minutes and the old 15-minute cap sat right on top of
    # that, so it intermittently timed out. A timeout surfaces as
    # "##[error]The operation was canceled" and the job's conclusion is
    # `cancelled` — indistinguishable at a glance from a concurrency
    # cancellation, and NOT a test failure. Because both deploy jobs list e2e in
    # `needs`, that skipped the deploy: on 2026-09-04 production merged green and
    # silently stayed on the previous version. Headroom is cheap; a deploy that
    # quietly does not happen is not.
    timeout-minutes: 30
    if: github.event_name == 'push'
    needs: [build-and-lint]
    # Deliberately a deploy gate: `continue-on-error` was removed to stop failures
    # being masked. That makes the timeout above load-bearing.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          SKIP_ENV_VALIDATION: 'true'
          AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' && secrets.AUTH_SECRET || 'fallback_test_secret_for_ci_environments_only_32_chars' }}
          AUTH_URL: http://localhost:3000

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: [build-and-lint, migrate-staging, e2e]
    # No job-level group: the workflow-level one above already guarantees a
    # single run per branch, and this one reached across branches.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Map of recent deployments (git sha → URL), baked into the build so the
      # middleware can serve an old tab's requests from the deployment it was
      # loaded from — a deploy must be invisible to someone mid-task. Fails the
      # run if the map cannot be built: an empty map silently degrades every old
      # tab to a "reload" notice.
      - name: Build deploy map (skew protection)
        run: node scripts/build-deploy-map.mjs --env preview --branch staging --github-env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build for Cloudflare Pages
        shell: bash
        run: |
          # Without a build id the deploy-skew guard is silently inert — no header
          # is sent and nothing is compared (audit 2026-09-19, P1-1). Refuse.
          if [ -z "$APP_BUILD_ID" ]; then echo "::error::APP_BUILD_ID is empty; the deploy-skew guard would be disabled"; exit 1; fi
          if [ -z "$APP_DEPLOY_MAP" ]; then echo "::error::APP_DEPLOY_MAP is unset; the 'Build deploy map' step did not run"; exit 1; fi
          npx @cloudflare/next-on-pages
        env:
          SKIP_ENV_VALIDATION: 'true'
          # Build identity for deployment-skew detection. Baked into both the
          # client bundle (sent as x-deployment-id) and the middleware bundle
          # (compared against it). If this is ever empty the guard goes inert
          # and stale tabs silently fail again — see src/middleware.ts.
          APP_BUILD_ID: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (Preview)
        shell: bash
        run: npx wrangler pages deploy .vercel/output/static --project-name="verazadoptantes2" --branch="staging" | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Prove the deploy-skew guard is live on what we just deployed, not just
      # that the code exists (audit 2026-09-19, P1-1 / PR-2). A request claiming
      # an old build must get 409 + the marker header + this commit's id; a
      # normal request must still succeed. Fails the run if the guard went dead.
      - name: Verify deploy-skew guard on the new deployment
        shell: bash
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.verazadoptantes2\.pages\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then echo "::error::could not find the deployment URL in the wrangler output"; exit 1; fi
          echo "checking $URL"
          for i in $(seq 1 10); do
            curl -s -o /dev/null -D headers.txt -w '%{http_code}' -X POST "$URL/" -H 'x-deployment-id: ci-stale-probe' -H 'Next-Action: ci-probe' > code.txt || true
            [ "$(cat code.txt)" = "409" ] && break
            sleep 6
          done
          CODE=$(cat code.txt)
          SKEW=$(grep -i '^x-deployment-skew:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          SERVER=$(grep -i '^x-deployment-id-server:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "stale request -> $CODE, x-deployment-skew=$SKEW, server build=$SERVER"
          [ "$CODE" = "409" ] || { echo "::error::deploy-skew guard is NOT active (got $CODE, expected 409)"; exit 1; }
          [ "$SKEW" = "1" ] || { echo "::error::409 without the x-deployment-skew marker"; exit 1; }
          [ "$SERVER" = "${{ github.sha }}" ] || { echo "::error::server build id $SERVER != ${{ github.sha }}"; exit 1; }
          OK=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
          echo "normal request -> $OK"
          case "$OK" in 2*|3*) ;; *) echo "::error::normal request failed with $OK"; exit 1;; esac
          # A tab from the PREVIOUS build must be served by that build, not rejected.
          if [ -z "$APP_PREVIOUS_BUILD_ID" ]; then echo "::warning::no previous build in the deploy map; skipping the forwarding check"; exit 0; fi
          curl -s -o /dev/null -D prev.txt -w '%{http_code}' -X POST "$URL/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' > prevcode.txt || true
          PCODE=$(cat prevcode.txt)
          PROXIED=$(grep -i '^x-deployment-skew-proxied:' prev.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "previous-build request -> $PCODE, served by build: ${PROXIED:-<not forwarded>}"
          [ "$PROXIED" = "$APP_PREVIOUS_BUILD_ID" ] || { echo "::error::a tab from the previous build ($APP_PREVIOUS_BUILD_ID) was NOT served by its own deployment"; exit 1; }
          [ "$PCODE" != "409" ] || { echo "::error::previous-build request was rejected with 409"; exit 1; }
          # A path that resolves to another host must never be forwarded (SSRF).
          ESC=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is -X POST "$URL//example.com/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' || true)
          echo "cross-host path -> $ESC (must be 409)"
          [ "$ESC" = "409" ] || { echo "::error::a //host path was not rejected ($ESC) — the forwarder may be an open proxy"; exit 1; }

  # Deploy to Production (Direct Upload)
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-and-lint, migrate-production, e2e]
    # No job-level group — see the workflow-level concurrency block.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Map of recent deployments (git sha → URL), baked into the build so the
      # middleware can serve an old tab's requests from the deployment it was
      # loaded from — a deploy must be invisible to someone mid-task. Fails the
      # run if the map cannot be built: an empty map silently degrades every old
      # tab to a "reload" notice.
      - name: Build deploy map (skew protection)
        run: node scripts/build-deploy-map.mjs --env production --github-env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build for Cloudflare Pages
        shell: bash
        run: |
          # Without a build id the deploy-skew guard is silently inert — no header
          # is sent and nothing is compared (audit 2026-09-19, P1-1). Refuse.
          if [ -z "$APP_BUILD_ID" ]; then echo "::error::APP_BUILD_ID is empty; the deploy-skew guard would be disabled"; exit 1; fi
          if [ -z "$APP_DEPLOY_MAP" ]; then echo "::error::APP_DEPLOY_MAP is unset; the 'Build deploy map' step did not run"; exit 1; fi
          npx @cloudflare/next-on-pages
        env:
          SKIP_ENV_VALIDATION: 'true'
          # Build identity for deployment-skew detection. Baked into both the
          # client bundle (sent as x-deployment-id) and the middleware bundle
          # (compared against it). If this is ever empty the guard goes inert
          # and stale tabs silently fail again — see src/middleware.ts.
          APP_BUILD_ID: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (Production)
        shell: bash
        run: npx wrangler pages deploy .vercel/output/static --project-name="verazadoptantes2" --branch="master" | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Prove the deploy-skew guard is live on what we just deployed, not just
      # that the code exists (audit 2026-09-19, P1-1 / PR-2). A request claiming
      # an old build must get 409 + the marker header + this commit's id; a
      # normal request must still succeed. Fails the run if the guard went dead.
      - name: Verify deploy-skew guard on the new deployment
        shell: bash
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.verazadoptantes2\.pages\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then echo "::error::could not find the deployment URL in the wrangler output"; exit 1; fi
          echo "checking $URL"
          for i in $(seq 1 10); do
            curl -s -o /dev/null -D headers.txt -w '%{http_code}' -X POST "$URL/" -H 'x-deployment-id: ci-stale-probe' -H 'Next-Action: ci-probe' > code.txt || true
            [ "$(cat code.txt)" = "409" ] && break
            sleep 6
          done
          CODE=$(cat code.txt)
          SKEW=$(grep -i '^x-deployment-skew:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          SERVER=$(grep -i '^x-deployment-id-server:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "stale request -> $CODE, x-deployment-skew=$SKEW, server build=$SERVER"
          [ "$CODE" = "409" ] || { echo "::error::deploy-skew guard is NOT active (got $CODE, expected 409)"; exit 1; }
          [ "$SKEW" = "1" ] || { echo "::error::409 without the x-deployment-skew marker"; exit 1; }
          [ "$SERVER" = "${{ github.sha }}" ] || { echo "::error::server build id $SERVER != ${{ github.sha }}"; exit 1; }
          OK=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
          echo "normal request -> $OK"
          case "$OK" in 2*|3*) ;; *) echo "::error::normal request failed with $OK"; exit 1;; esac
          # A tab from the PREVIOUS build must be served by that build, not rejected.
          if [ -z "$APP_PREVIOUS_BUILD_ID" ]; then echo "::warning::no previous build in the deploy map; skipping the forwarding check"; exit 0; fi
          curl -s -o /dev/null -D prev.txt -w '%{http_code}' -X POST "$URL/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' > prevcode.txt || true
          PCODE=$(cat prevcode.txt)
          PROXIED=$(grep -i '^x-deployment-skew-proxied:' prev.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "previous-build request -> $PCODE, served by build: ${PROXIED:-<not forwarded>}"
