name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

# Serialise per branch, at the WORKFLOW level.
#
# The deploy jobs used to carry `concurrency: deploy-staging|deploy-production`
# with `cancel-in-progress: true`. Every run contains BOTH deploy jobs — one
# disabled by an `if`, but still a member of its group — so a newer run entering
# `deploy-staging` cancelled an in-flight sibling run on the OTHER branch, and
# cancelled it wholesale rather than just its deploy. On 2026-09-03 a push to
# staging killed the production run for PR #76 at its E2E step, so
# `Deploy to Production` was skipped and prod silently stayed on the previous
# version after a green merge. Nothing failed; the deploy simply never ran.
#
# Keying the group to the ref confines superseding to the same branch.
# `cancel-in-progress` is deliberately FALSE on master: a newer staging push
# should replace an older one, but a production deploy already under way should
# finish rather than be interrupted part-way through `wrangler pages deploy`.
# v2.56.131: the group also keys on the EVENT. A push to staging and the
# pull_request run for the open release PR are created seconds apart on the
# same branch, and with only the ref in the key the PR run takes the slot and
# cancels the push — which is what killed run 37148913122 four seconds after
# it started, with the deploy still ahead of it. A cancelled run reads as
# `cancelled`, not `failure`, so it looks like someone superseded it on
# purpose. They are different pipelines (a PR run skips e2e, migrations and
# both deploys) and have no business cancelling each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Blocks a package.json version that moves BACKWARDS relative to its own
  # history. package.json is the only reliable deploy identity here, and on
  # 2026-09-06 two parallel sessions produced 2.56.0 followed by 2.55.19.
  # Its own job (not a build-and-lint step) so the failure names the problem
  # instead of hiding inside a build log — and it needs git history, which the
  # default fetch-depth: 1 checkout does not provide.
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Check version does not regress
        run: node scripts/check-version-bump.mjs

  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every other job descends from this one, so gating it here stops a
    # regressed version reaching migrations or a deploy — and fails in ~30s
    # rather than after a full build.
    needs: [version-guard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # vitest 4 needs rolldown's linux native binary. It IS in package-lock,
      # but `npm ci` skips it: `.npmrc` sets legacy-peer-deps=true, which hits
      # npm's optional-dependency bug ("Cannot find module
      # '@rolldown/binding-linux-x64-gnu'", 2.56.20 → pulled in 2.56.21). Unpack
      # exactly the version rolldown asks for, without `npm install`, which would
      # re-resolve the whole tree. Restored 2.56.67 (audit 2026-09-19, P1-2):
      # the domain tests for deploy recovery never gated a deploy before this.
      - name: Install rolldown native binding (npm optional-deps bug)
        run: |
          V=$(node -p "require('./node_modules/rolldown/package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu']")
          if [ -d node_modules/@rolldown/binding-linux-x64-gnu ]; then echo "binding already installed ($V)"; exit 0; fi
          npm pack "@rolldown/binding-linux-x64-gnu@$V" --silent
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf rolldown-binding-linux-x64-gnu-$V.tgz -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          rm -f rolldown-binding-linux-x64-gnu-$V.tgz
          node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('rolldown binding', process.argv[1], 'OK')" "$V"

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Skip actual Cloudflare binding checks during CI build
          SKIP_ENV_VALIDATION: 'true'

      # Every export of a 'use server' module is a POST endpoint a stranger can
      # call with arguments they choose. This counts them in the built manifest
      # and fails when the number moves without someone saying so. It is the
      # only check that sees a directive hidden below a comment, or a new action
      # that wraps a trusted helper under a different name.
      - name: Assert the browser-callable surface has not grown
        run: node scripts/check-action-surface.mjs

  # This job runs after build-and-lint passes
  # It's a "gate" that must pass before merging to main
  ready-to-merge:
    name: ✅ Ready to Merge
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    steps:
      - run: echo "All checks passed!"

  # Apply D1 migrations on production deploy
  migrate-production:
    name: 🗃️ Apply D1 Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-and-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to production
        run: npx wrangler d1 migrations apply pet-adoption-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Idempotent data backfill — parses legacy `contact_info` blobs into
      # structured `contact_entries` for pre-v2.14.x rows so the PII popover
      # has a chip to anchor to. Re-runs are no-ops once a row is migrated
      # (the script's WHERE clause skips rows that already have entries).
      - name: Backfill contact_entries (idempotent)
        run: npx tsx scripts/backfill-contact-entries.ts --target=production --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Apply D1 migrations on staging deploy
  migrate-staging:
    name: 🗃️ Apply Staging Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: [build-and-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to staging
        run: npx wrangler d1 migrations apply pet-adoption-db-staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Idempotent data backfill — same as production (see migrate-production).
      # Running on staging too keeps the two environments in lockstep.
      - name: Backfill contact_entries (idempotent)
        run: npx tsx scripts/backfill-contact-entries.ts --target=staging --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Advisory: flags ON in production but not in tests/seed.sql mean the e2e
      # suite never runs the code users run (how v2.56.62 shipped). Read-only
      # query of production app_config; never fails the run. Audit PR-4.
      - name: Feature-flag parity (seed vs production)
        continue-on-error: true
        run: node scripts/check-flag-parity.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploy to Staging (Direct Upload)
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    # ── Split by project, one server each (v2.56.129) ──────────────────────
    #
    # This ran as ONE `next dev` process for the whole suite, ~149 tests over
    # ~25 minutes. Dev compiles routes on demand and its heap grows with every
    # one it touches, so it reached --max-old-space-size and restarted itself
    # rather than be OOM-killed — SIX times in run 37135478653. Each restart is
    # seconds of dead server, and whichever test was in flight died with
    # ERR_CONNECTION_REFUSED / RESET / EMPTY_RESPONSE or an assertion timing
    # out on a page that never loaded. A different test each time, so it read
    # as flaky tests rather than as one cause. v2.56.128 took FIVE attempts to
    # land; 2026-10-03 cost five runs and ~3 hours for zero real bugs.
    #
    # Splitting fixes it by removing the condition rather than managing it: no
    # server lives long enough to reach the ceiling. Wall clock drops with it,
    # because the three groups run at once.
    #
    # Split along the EXISTING project boundary first — those groups already
    # share auth state — then in half again inside `user` and `authed`, which
    # are too big on their own to hit the time budget. Each leg gets its own
    # seeded DB, so cross-FILE fixture coupling surfaces here: that is known to
    # exist (tests/contract-link.spec.ts's history is one such fix) and is the
    # remaining work in .agents/plans/e2e-shard-the-suite.md.
    #
    # Budget: deploy is a fixed ~4 min and the whole pipeline should be ~10,
    # so e2e has ~6. A leg is ~3 min of fixed overhead (npm ci, browsers,
    # seed, boot) plus its tests, which puts the ceiling near 40 tests a leg.
    #
    # Two fixes already tried and rejected — see
    # .agents/plans/e2e-shard-the-suite.md before reaching for either:
    #   · raising --max-old-space-size (moves the wall, and trades Next's
    #     graceful restart for the kernel's OOM killer on a 7 GB runner)
    #   · `next build && next start` (src/lib/db.ts only falls back to the
    #     local SQLite DB when NODE_ENV !== 'production', so a built server has
    #     no database and /api/ready never returns 200)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced by TIME, not by test count — `--shard` divides files
          # evenly, which is not the same thing. Measured on run 37149642645
          # (five legs, 15.6 min): authed-2 took 11.8 min while `rest` took
          # 3.0, because `authed` holds ~78% of the suite's test time
          # (view-as 2.8, pending-searches 2.4, landing-pages 1.7 CI-minutes).
          # One leg at 11.8 set the whole pipeline's length. Hence 4 legs for
          # `authed`, 2 for `user`, 1 for the rest.
          #
          # `--shard` rather than naming files per leg: a new spec joins a
          # shard automatically. Listing files by hand means a spec someone
          # forgets to add runs NOWHERE, and silently passing by not running
          # is the worst failure this pipeline could have.
          - group: user-1
            projects: --project=user --shard=1/2
          - group: user-2
            projects: --project=user --shard=2/2
          - group: authed-1
            projects: --project=authed --shard=1/4
          - group: authed-2
            projects: --project=authed --shard=2/4
          - group: authed-3
            projects: --project=authed --shard=3/4
          - group: authed-4
            projects: --project=authed --shard=4/4
          - group: rest
            projects: --project=unauthed --project=mobile
    # Each group is now ~5-12 minutes, but the headroom stays: a timeout
    # surfaces as "##[error]The operation was canceled" with conclusion
    # `cancelled` — indistinguishable at a glance from a concurrency
    # cancellation, and NOT a test failure. Because both deploy jobs list e2e
    # in `needs`, that skips the deploy: on 2026-09-04 production merged green
    # and silently stayed on the previous version.
    timeout-minutes: 30
    if: github.event_name == 'push'
    # v2.56.131: deliberately NOT `needs: [build-and-lint]`. e2e installs its
    # own dependencies and runs its own server; it consumes nothing the build
    # produces, so waiting for it only added ~2 minutes to the critical path.
    # Both deploys still list build-and-lint AND e2e in `needs`, so nothing
    # ships without both. The cost is runner minutes spent on a run whose
    # build was going to fail anyway, which is the cheaper of the two.
    #
    # Deliberately a deploy gate: `continue-on-error` was removed to stop failures
    # being masked. With a matrix, `needs: [e2e]` requires EVERY group to pass.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      # ~1 minute per leg, and with seven legs that is a minute off the
      # critical path as well as six off the bill. Keyed on the lockfile and
      # the Node version because node_modules carries compiled native modules
      # (better-sqlite3) that are not portable across either.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20.18-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test ${{ matrix.projects }}
        env:
          CI: true
          SKIP_ENV_VALIDATION: 'true'
          AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' && secrets.AUTH_SECRET || 'fallback_test_secret_for_ci_environments_only_32_chars' }}
          AUTH_URL: http://localhost:3000

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          # Unique per group — a matrix uploading the same artifact name twice
          # fails the upload.
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          retention-days: 14

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: [build-and-lint, migrate-staging, e2e]
    # No job-level group: the workflow-level one above already guarantees a
    # single run per branch, and this one reached across branches.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # v2.56.131: refuse to deploy a commit that is no longer the branch tip.
      #
      # Two sessions pushing minutes apart produce two runs. Concurrency is
      # meant to cancel the older one, but it misfires (see the note at the top
      # of this file), and on 2026-10-03 an older run was still in E2E while a
      # newer commit sat on the branch. Had it finished, it would have deployed
      # ITS tree — rolling staging back to the previous version with every job
      # green and nothing to show for it. That is the same silent class of
      # failure as a skipped deploy, and harder to notice because the pipeline
      # says success.
      #
      # Fails loudly rather than skipping: the newer run deploys, and a red job
      # that says why beats a green one that quietly shipped the wrong thing.
      - name: Refuse to deploy a superseded commit
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --depth=1 --quiet
          TIP="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} has moved on — this run is for ${GITHUB_SHA:0:8}, the tip is ${TIP:0:8}. The newer run deploys; this one must not overwrite it."
            exit 1
          fi
          echo "✓ ${GITHUB_SHA:0:8} is still the tip of ${GITHUB_REF_NAME}"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Map of recent deployments (git sha → URL), baked into the build so the
      # middleware can serve an old tab's requests from the deployment it was
      # loaded from — a deploy must be invisible to someone mid-task. Fails the
      # run if the map cannot be built: an empty map silently degrades every old
      # tab to a "reload" notice.
      - name: Build deploy map (skew protection)
        run: node scripts/build-deploy-map.mjs --env preview --branch staging --github-env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build for Cloudflare Pages
        shell: bash
        run: |
          # Without a build id the deploy-skew guard is silently inert — no header
          # is sent and nothing is compared (audit 2026-09-19, P1-1). Refuse.
          if [ -z "$APP_BUILD_ID" ]; then echo "::error::APP_BUILD_ID is empty; the deploy-skew guard would be disabled"; exit 1; fi
          if [ -z "$APP_DEPLOY_MAP" ]; then echo "::error::APP_DEPLOY_MAP is unset; the 'Build deploy map' step did not run"; exit 1; fi
          npx @cloudflare/next-on-pages
        env:
          SKIP_ENV_VALIDATION: 'true'
          # Build identity for deployment-skew detection. Baked into both the
          # client bundle (sent as x-deployment-id) and the middleware bundle
          # (compared against it). If this is ever empty the guard goes inert
          # and stale tabs silently fail again — see src/middleware.ts.
          APP_BUILD_ID: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (Preview)
        shell: bash
        run: npx wrangler pages deploy .vercel/output/static --project-name="verazadoptantes2" --branch="staging" | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Prove the deploy-skew guard is live on what we just deployed, not just
      # that the code exists (audit 2026-09-19, P1-1 / PR-2). A request claiming
      # an old build must get 409 + the marker header + this commit's id; a
      # normal request must still succeed. Fails the run if the guard went dead.
      - name: Verify deploy-skew guard on the new deployment
        shell: bash
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.verazadoptantes2\.pages\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then echo "::error::could not find the deployment URL in the wrangler output"; exit 1; fi
          echo "checking $URL"
          for i in $(seq 1 10); do
            curl -s -o /dev/null -D headers.txt -w '%{http_code}' -X POST "$URL/" -H 'x-deployment-id: ci-stale-probe' -H 'Next-Action: ci-probe' > code.txt || true
            [ "$(cat code.txt)" = "409" ] && break
            sleep 6
          done
          CODE=$(cat code.txt)
          SKEW=$(grep -i '^x-deployment-skew:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          SERVER=$(grep -i '^x-deployment-id-server:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "stale request -> $CODE, x-deployment-skew=$SKEW, server build=$SERVER"
          [ "$CODE" = "409" ] || { echo "::error::deploy-skew guard is NOT active (got $CODE, expected 409)"; exit 1; }
          [ "$SKEW" = "1" ] || { echo "::error::409 without the x-deployment-skew marker"; exit 1; }
          [ "$SERVER" = "${{ github.sha }}" ] || { echo "::error::server build id $SERVER != ${{ github.sha }}"; exit 1; }
          # The stale probe above proves the WORKER is live, but Pages can still
          # be seconds from serving the static asset for `/` — a plain GET then
          # 404s. That is what reddened 2026-09-25 and 2026-09-30, both times on
          # a deploy that had succeeded. 2.56.95 gave the forwarding probe a
          # readiness wait and missed this one, which runs before it.
          # Retry the PROBE, assert ONCE: a genuinely broken deploy still fails.
          for i in $(seq 1 10); do
            OK=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            case "$OK" in 2*|3*) break;; esac
            sleep 6
          done
          echo "normal request -> $OK"
          case "$OK" in 2*|3*) ;; *) echo "::error::normal request failed with $OK"; exit 1;; esac
          # A tab from the PREVIOUS build must be served by that build, not rejected.
          if [ -z "$APP_PREVIOUS_BUILD_ID" ]; then echo "::warning::no previous build in the deploy map; skipping the forwarding check"; exit 0; fi
          # The PREVIOUS deployment needs its own readiness wait. The stale probe
          # above only proves the NEW worker is live; Cloudflare can still be a
          # few seconds from routing the just-superseded deployment at its own
          # URL, and the forward then finds nothing. Probing 0.1s after `wrangler
          # pages deploy` returned is what reddened 2026-09-25 and 2026-09-28 —
          # both times the guard itself was fine (verified by hand afterwards).
          # Retry the PROBE, assert ONCE: a genuinely dead forwarder still fails.
          for i in $(seq 1 10); do
            curl -s -o /dev/null -D prev.txt -w '%{http_code}' -X POST "$URL/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' > prevcode.txt || true
            grep -qi '^x-deployment-skew-proxied:' prev.txt && break
            sleep 6
          done
          PCODE=$(cat prevcode.txt)
          PROXIED=$(grep -i '^x-deployment-skew-proxied:' prev.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "previous-build request -> $PCODE, served by build: ${PROXIED:-<not forwarded>}"
          [ "$PROXIED" = "$APP_PREVIOUS_BUILD_ID" ] || { echo "::error::a tab from the previous build ($APP_PREVIOUS_BUILD_ID) was NOT served by its own deployment"; exit 1; }
          [ "$PCODE" != "409" ] || { echo "::error::previous-build request was rejected with 409"; exit 1; }
          # A path that resolves to another host must never be forwarded (SSRF).
          ESC=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is -X POST "$URL//example.com/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' || true)
          echo "cross-host path -> $ESC (must be 409)"
          [ "$ESC" = "409" ] || { echo "::error::a //host path was not rejected ($ESC) — the forwarder may be an open proxy"; exit 1; }

  # Deploy to Production (Direct Upload)
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-and-lint, migrate-production, e2e]
    # No job-level group — see the workflow-level concurrency block.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same guard as staging: never let an older run overwrite a newer deploy.
      # It matters more here — production is the one nobody notices has gone
      # backwards until a user reports it.
      - name: Refuse to deploy a superseded commit
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --depth=1 --quiet
          TIP="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} has moved on — this run is for ${GITHUB_SHA:0:8}, the tip is ${TIP:0:8}. The newer run deploys; this one must not overwrite it."
            exit 1
          fi
          echo "✓ ${GITHUB_SHA:0:8} is still the tip of ${GITHUB_REF_NAME}"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Map of recent deployments (git sha → URL), baked into the build so the
      # middleware can serve an old tab's requests from the deployment it was
      # loaded from — a deploy must be invisible to someone mid-task. Fails the
      # run if the map cannot be built: an empty map silently degrades every old
      # tab to a "reload" notice.
      - name: Build deploy map (skew protection)
        run: node scripts/build-deploy-map.mjs --env production --github-env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build for Cloudflare Pages
        shell: bash
        run: |
          # Without a build id the deploy-skew guard is silently inert — no header
          # is sent and nothing is compared (audit 2026-09-19, P1-1). Refuse.
          if [ -z "$APP_BUILD_ID" ]; then echo "::error::APP_BUILD_ID is empty; the deploy-skew guard would be disabled"; exit 1; fi
          if [ -z "$APP_DEPLOY_MAP" ]; then echo "::error::APP_DEPLOY_MAP is unset; the 'Build deploy map' step did not run"; exit 1; fi
          npx @cloudflare/next-on-pages
        env:
          SKIP_ENV_VALIDATION: 'true'
          # Build identity for deployment-skew detection. Baked into both the
          # client bundle (sent as x-deployment-id) and the middleware bundle
          # (compared against it). If this is ever empty the guard goes inert
          # and stale tabs silently fail again — see src/middleware.ts.
          APP_BUILD_ID: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (Production)
        shell: bash
        run: npx wrangler pages deploy .vercel/output/static --project-name="verazadoptantes2" --branch="master" | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Prove the deploy-skew guard is live on what we just deployed, not just
      # that the code exists (audit 2026-09-19, P1-1 / PR-2). A request claiming
      # an old build must get 409 + the marker header + this commit's id; a
      # normal request must still succeed. Fails the run if the guard went dead.
      - name: Verify deploy-skew guard on the new deployment
        shell: bash
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.verazadoptantes2\.pages\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then echo "::error::could not find the deployment URL in the wrangler output"; exit 1; fi
          echo "checking $URL"
          for i in $(seq 1 10); do
            curl -s -o /dev/null -D headers.txt -w '%{http_code}' -X POST "$URL/" -H 'x-deployment-id: ci-stale-probe' -H 'Next-Action: ci-probe' > code.txt || true
            [ "$(cat code.txt)" = "409" ] && break
            sleep 6
          done
          CODE=$(cat code.txt)
          SKEW=$(grep -i '^x-deployment-skew:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          SERVER=$(grep -i '^x-deployment-id-server:' headers.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "stale request -> $CODE, x-deployment-skew=$SKEW, server build=$SERVER"
          [ "$CODE" = "409" ] || { echo "::error::deploy-skew guard is NOT active (got $CODE, expected 409)"; exit 1; }
          [ "$SKEW" = "1" ] || { echo "::error::409 without the x-deployment-skew marker"; exit 1; }
          [ "$SERVER" = "${{ github.sha }}" ] || { echo "::error::server build id $SERVER != ${{ github.sha }}"; exit 1; }
          # The stale probe above proves the WORKER is live, but Pages can still
          # be seconds from serving the static asset for `/` — a plain GET then
          # 404s. That is what reddened 2026-09-25 and 2026-09-30, both times on
          # a deploy that had succeeded. 2.56.95 gave the forwarding probe a
          # readiness wait and missed this one, which runs before it.
          # Retry the PROBE, assert ONCE: a genuinely broken deploy still fails.
          for i in $(seq 1 10); do
            OK=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            case "$OK" in 2*|3*) break;; esac
            sleep 6
          done
          echo "normal request -> $OK"
          case "$OK" in 2*|3*) ;; *) echo "::error::normal request failed with $OK"; exit 1;; esac
          # A tab from the PREVIOUS build must be served by that build, not rejected.
          if [ -z "$APP_PREVIOUS_BUILD_ID" ]; then echo "::warning::no previous build in the deploy map; skipping the forwarding check"; exit 0; fi
          # The PREVIOUS deployment needs its own readiness wait. The stale probe
          # above only proves the NEW worker is live; Cloudflare can still be a
          # few seconds from routing the just-superseded deployment at its own
          # URL, and the forward then finds nothing. Probing 0.1s after `wrangler
          # pages deploy` returned is what reddened 2026-09-25 and 2026-09-28 —
          # both times the guard itself was fine (verified by hand afterwards).
          # Retry the PROBE, assert ONCE: a genuinely dead forwarder still fails.
          for i in $(seq 1 10); do
            curl -s -o /dev/null -D prev.txt -w '%{http_code}' -X POST "$URL/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' > prevcode.txt || true
            grep -qi '^x-deployment-skew-proxied:' prev.txt && break
            sleep 6
          done
          PCODE=$(cat prevcode.txt)
          PROXIED=$(grep -i '^x-deployment-skew-proxied:' prev.txt | tr -d '\r' | awk '{print $2}' || true)
          echo "previous-build request -> $PCODE, served by build: ${PROXIED:-<not forwarded>}"
          [ "$PROXIED" = "$APP_PREVIOUS_BUILD_ID" ] || { echo "::error::a tab from the previous build ($APP_PREVIOUS_BUILD_ID) was NOT served by its own deployment"; exit 1; }
          [ "$PCODE" != "409" ] || { echo "::error::previous-build request was rejected with 409"; exit 1; }
          # A path that resolves to another host must never be forwarded (SSRF).
          ESC=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is -X POST "$URL//example.com/" -H "x-deployment-id: $APP_PREVIOUS_BUILD_ID" -H 'Next-Action: ci-probe' || true)
          echo "cross-host path -> $ESC (must be 409)"
          [ "$ESC" = "409" ] || { echo "::error::a //host path was not rejected ($ESC) — the forwarder may be an open proxy"; exit 1; }



