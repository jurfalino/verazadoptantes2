<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Buen Adoptante — Launch carousel, slide 1 (cover / hook). 1080x1080. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d39"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- oversized paw watermark, bottom-right, very subtle -->
  <g transform="translate(870,840) scale(2.7) translate(-256,-272)" fill="#ffffff" opacity="0.05">
    <ellipse cx="256" cy="310" rx="52" ry="46"/>
    <ellipse cx="198" cy="238" rx="28" ry="34" transform="rotate(-12 198 238)"/>
    <ellipse cx="314" cy="238" rx="28" ry="34" transform="rotate(12 314 238)"/>
    <ellipse cx="158" cy="278" rx="22" ry="28" transform="rotate(-28 158 278)"/>
    <ellipse cx="354" cy="278" rx="22" ry="28" transform="rotate(28 354 278)"/>
  </g>

  <!-- brand lockup, top-left -->
  <g transform="translate(96,92)">
    <g transform="scale(0.20) translate(-80,-38)">
      <path d="M256 38 C256 38 432 100 432 100 C432 100 432 270 432 270 C432 362 354 432 256 478 C158 432 80 362 80 270 C80 270 80 100 80 100 C80 100 256 38 256 38 Z" fill="#14b8a6"/>
      <ellipse cx="256" cy="310" rx="52" ry="46" fill="#042f2e"/>
      <ellipse cx="198" cy="238" rx="28" ry="34" fill="#042f2e" transform="rotate(-12 198 238)"/>
      <ellipse cx="314" cy="238" rx="28" ry="34" fill="#042f2e" transform="rotate(12 314 238)"/>
      <ellipse cx="158" cy="278" rx="22" ry="28" fill="#042f2e" transform="rotate(-28 158 278)"/>
      <ellipse cx="354" cy="278" rx="22" ry="28" fill="#042f2e" transform="rotate(28 354 278)"/>
    </g>
    <text x="86" y="34" font-family="'Poppins','Montserrat','Trebuchet MS',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="1" fill="#ffffff">BUEN <tspan fill="#5eead4">ADOPTANTE</tspan></text>
  </g>

  <!-- headline -->
  <g font-family="'Poppins','Montserrat','Trebuchet MS',Arial,sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="540" y="470" font-size="88">¿Sabés a quién</text>
    <text x="540" y="568" font-size="88">le estás</text>
    <text x="540" y="666" font-size="88">entregando <tspan fill="#5eead4">ese animal?</tspan></text>
  </g>

  <!-- accent rule -->
  <rect x="450" y="740" width="180" height="8" rx="4" fill="#14b8a6"/>

  <!-- subhead -->
  <text x="540" y="828" font-family="'Poppins','Montserrat','Trebuchet MS',Arial,sans-serif" font-size="33" font-weight="500" fill="#cbd5d1" text-anchor="middle">El Veraz de las adopciones. Chequeá antes de entregar.</text>

  <!-- footer: handle + swipe hint -->
  <text x="96" y="1000" font-family="'Poppins','Montserrat','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="600" fill="#5eead4">@buenadoptante</text>
  <text x="984" y="1000" font-family="'Poppins','Montserrat','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="end">Deslizá →</text>
</svg>
