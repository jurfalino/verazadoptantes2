# v2.55.17 (animal-timeline PR4): daily follow-up reminder cron.
# Cloudflare PAGES has no cron — this standalone Worker runs on the same D1
# and writes `follow_up_due` rows into the app's `notifications` table.
# Deployed by .github/workflows/followup-worker.yml (staging: --env staging).

name = "buenadoptante-followup-cron"
main = "src/index.ts"
compatibility_date = "2025-01-27"

# Cloudflare Workers Logs (~7 day retention, queryable in the dashboard).
# Free, and the fallback when Axiom is unreachable or its secrets are missing —
# every entry is still written to the runtime stream by src/log.ts. Before this
# the cron's only output was a live `wrangler tail`, so a failed daily run left
# no trace at all.
[observability]
enabled = true

[triggers]
crons = ["0 12 * * *"] # 09:00 America/Argentina/Buenos_Aires

[vars]
# Deep-link base for notification/email URLs.
APP_BASE_URL = "https://buenadoptante.org"
# Tags every Axiom entry so cron rows filter alongside the app's by env.
APP_ENV = "production"
# Dataset name is not a secret; only AXIOM_TOKEN is (set via `wrangler secret put`).
AXIOM_DATASET = "buenadoptante"

[[d1_databases]]
binding = "DB"
database_name = "pet-adoption-db"
database_id = "62ec01e7-deae-4536-be62-7c0a0064b45c"

[env.staging]
name = "buenadoptante-followup-cron-staging"

[env.staging.observability]
enabled = true

[env.staging.vars]
APP_BASE_URL = "https://staging.verazadoptantes2.pages.dev"
APP_ENV = "staging"
AXIOM_DATASET = "buenadoptante"

[env.staging.triggers]
crons = ["0 12 * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pet-adoption-db-staging"
database_id = "1b3b21c3-38ef-45ee-af86-d1f08adfb834"
