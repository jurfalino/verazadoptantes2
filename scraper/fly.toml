# fly.toml app configuration file for verazadoptantes2
# Playwright Facebook scraper service

app = 'verazadoptantes2'
primary_region = 'gru'  # São Paulo - closest to Argentina

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
